<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10/B BİLİŞİM - Ders Portalı</title>
<style>
:root{--bg:#090d16;--card:#111726;--hover:#1a263b;--border:rgba(255,255,255,.12);--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8}
[data-theme=light]{--bg:#f8fafc;--card:#fff;--hover:#eef4fa;--border:rgba(15,23,42,.12);--text:#0f172a;--muted:#64748b;--accent:#0284c7}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.5rem;background:var(--card);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:.8rem}.brand-logo,.notice-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff}.brand h1{font-size:1.05rem}.brand small{color:var(--muted)}button{font:inherit;cursor:pointer}.theme-btn,.nav-btn,.demo-btn{border:1px solid var(--border);border-radius:9px;padding:.55rem .85rem;background:transparent;color:var(--text);font-weight:700}.theme-btn:hover,.nav-btn:hover,.demo-btn:hover,.card:hover{background:var(--hover)}main{width:min(980px,calc(100% - 2rem));margin:2rem auto;flex:1}.panel{min-height:450px;padding:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:18px}.panel-nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.4rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}.step{font-weight:800;font-size:1.1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1rem}.card,.item{border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}.card{padding:1.2rem .8rem;text-align:center;cursor:pointer;font-weight:700}.icon{font-size:2rem;display:block;margin-bottom:.55rem}.items{display:grid;gap:.75rem}.item{padding:1rem 1.1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.item:hover{background:var(--hover)}.item h3{font-size:.95rem;margin-bottom:.3rem}.item p{font-size:.8rem;color:var(--muted)}.demo{display:grid;place-items:center;text-align:center;min-height:310px;padding:2rem}.demo .code{font-size:3rem;font-weight:900;color:var(--accent);margin:.5rem}.demo h2{margin-bottom:.5rem}.demo p{max-width:520px;color:var(--muted);line-height:1.6}.demo strong{color:var(--text)}footer{text-align:center;padding:1.2rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border)}
</style>
</head>
<body>
<header><div class="brand"><img src="logo.jpg" class="brand-logo" alt="10/B Bilişim logosu"><div><h1>10/B BİLİŞİM</h1><small>Ders portalı</small></div></div><button class="theme-btn" id="themeBtn" type="button">🌙 Siyah Mod</button></header>
<main><section class="panel" id="mainPanel"></section></main><footer>&copy; 2026 10/B Bilişim Sınıfı Portalı</footer>
<script>
'use strict';
const subjects={
 fizik:{name:'Fizik',icon:'⚡',topics:[['1. ÜNİTE: KUVVET VE HAREKET',[['1.1. Sabit Hızlı Hareket','Konum, alınan yol, yer değiştirme, sürat ve hız kavramları'],['1.2. Bir Boyutta Sabit İvmeli Hareket','İvme, hız değişimi ve ivmeli hareket grafikleri'],['1. Ünite Ölçme ve Değerlendirme','Ünite sonu tarama testleri ve soru çözümleri']]],['2. ÜNİTE: ENERJİ',[['2.1. İş, Enerji ve Güç','Kuvvet-Yer Değiştirme grafikleri, İş ve Güç hesaplamaları'],['2.2. Enerji Biçimleri','Kinetik ve potansiyel enerji türleri'],['2.3. Mekanik Enerji','Mekanik enerjinin korunumu ve dönüşümleri'],['2.4. Enerji Kaynakları','Yenilenebilir ve yenilenemez enerji kaynakları']]],['3. ÜNİTE: ELEKTRİK',[['3.1. Basit Elektrik Devreleri','Devre elemanları ve sembolik gösterimleri'],['3.2. Elektrik Akımı','Akım şiddeti, yük miktarı ve iletkenlik'],['3.3. Ohm Yasası','Gerilim, akım ve direnç arasındaki ilişki'],['3.4. Dirençlerin Bağlanması','Seri ve paralel bağlama, eşdeğer direnç']]],['4. ÜNİTE: DALGALAR',[['4.1. Periyodik Hareketler','Titreşim, genlik, periyot ve frekans kavramları'],['4.2. Dalgaların Temel Kavramları','Dalga boyu, dalga tepesi ve çukuru'],['4.3. Dalgaların Sınıflandırılması','Enine ve boyuna dalgalar, mekanik ve elektromanyetik dalgalar']]]]},
 cografya:{name:'Coğrafya',icon:'🌍',topics:[['ÜNİTE 1: DOĞAL SİSTEMLER',[['Dünyanın Tektonik Oluşumu','Levha tektoniği ve jeolojik devirler'],['Kayaçlar','Püskürük, tortul ve başkalaşım kayaçları'],["Türkiye'nin Yer Şekilleri",'Dağlar, platolar ve ovaların oluşumu']]],['ÜNİTE 2: BEŞERÎ SİSTEMLER',[['Nüfus Özellikleri','Nüfusun dağılışı ve nüfus piramitleri'],['Göçlerin Nedenleri','İç ve dış göç hareketleri']]]]},
 edebiyat:{name:'Edebiyat',icon:'📚',topics:[['1. ÜNİTE: GİRİŞ',[['Edebiyat-Tarih İlişkisi','Edebiyatın toplum ve tarihle etkileşimi'],['Türk Edebiyatının Dönemleri','İslamiyet öncesi, etkisinde ve batı etkisinde edebiyat']]],['2. ÜNİTE: HİKÂYE',[['Dede Korkut Hikâyeleri','Oğuz Türklerinin anlatıları ve yapısı'],['Halk Hikâyeleri ve Mesnevi','Anonim ve divan dönemi hikâyeciliği']]]]},
 matematik:{name:'Matematik',icon:'📐',topics:[['1. ÜNİTE: SAYMA VE OLASILIK',[['Permütasyon ve Kombinasyon','Sıralama ve seçme problemleri'],['Olasılık','Basit olayların olası sonuçları']]],['2. ÜNİTE: FONKSİYONLAR',[['Fonksiyon Kavramı ve Grafikleri','Birebir ve örten fonksiyonlar'],['Bileşke ve Ters Fonksiyon','Fonksiyonlarda işlemler']]]]},
 kimya:{name:'Kimya',icon:'🧪',topics:[['1. ÜNİTE: KİMYANIN TEMEL KANUNLARI',[['Kütlenin Korunumu ve Katlı Oranlar','Lavoisier ve Proust kanunları'],['Mol Kavramı','Avogadro sayısı ve mol hesaplamaları']]]]},
 biyoloji:{name:'Biyoloji',icon:'🧬',topics:[['1. ÜNİTE: HÜCRE BÖLÜNMELERİ',[['Mitoz Bölünme','Hücre döngüsü ve evreleri'],['Mayoz Bölünme','Krossing-over ve çeşitlilik']]]]},
 tarih:{name:'Tarih',icon:'📜',topics:[['1. ÜNİTE: SELÇUKLU TÜRKİYESİ',[['Anadolu’nun Türkleşmesi','Malazgirt sonrası kurulan beylikler']]]]},
 felsefe:{name:'Felsefe',icon:'🏛️',topics:[['1. ÜNİTE: FELSEFEYİ TANIMA',[['Felsefi Düşünce','Felsefenin anlamı ve sorgulama']]]]},
 din:{name:'Din Kültürü',icon:'🌙',topics:[['1. ÜNİTE: ALLAH İNANCI VE İNSAN',[['İnsanın Fıtratı','İnanç ve ibadet ilişkisi']]]]},
 nesne:{name:'Nesne Tabanlı Prog.',icon:'💻',topics:[['1. ÜNİTE: KODLAMA TEMELLERİ',[['Değişkenler ve Veri Tipleri','C# / Java temelleri'],['Karar Yapıları','If-Else ve Switch-Case kullanımı']]]]},
 robotik:{name:'Robotik Kodlama',icon:'🤖',topics:[['1. ÜNİTE: SENSÖRLER VE MİKRODENETLEYİCİLER',[['Arduino Programlama','Pin modları ve sensör veri okuma']]]]}
};
const panel=document.getElementById('mainPanel'),themeBtn=document.getElementById('themeBtn');let current=null,topicIndex=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderSubjects(){current=null;panel.innerHTML='<div class="panel-nav"><div class="step">Dersler</div></div><div class="grid">'+Object.entries(subjects).map(([key,s])=>`<article class="card" data-key="${key}"><span class="icon">${s.icon}</span>${esc(s.name)}</article>`).join('')+'</div>';panel.querySelectorAll('.card').forEach(c=>c.onclick=()=>renderUnits(c.dataset.key));}
function renderUnits(key){current=key;const s=subjects[key];panel.innerHTML=`<div class="panel-nav"><button class="nav-btn" id="back" type="button">← Derslere dön</button><div class="step">${s.icon} ${esc(s.name)}</div></div><div class="items">${s.topics.map((t,i)=>`<article class="item" data-index="${i}"><div><h3>${esc(t[0])}</h3><p>${t[1].length} kazanım / alt başlık</p></div><span>→</span></article>`).join('')}</div>`;document.getElementById('back').onclick=renderSubjects;panel.querySelectorAll('.item').forEach(x=>x.onclick=()=>renderTopic(Number(x.dataset.index)));}
function renderTopic(index){topicIndex=index;const s=subjects[current],t=s.topics[index];panel.innerHTML=`<div class="panel-nav"><button class="nav-btn" id="back" type="button">← Ünitelere dön</button><div class="step">${esc(t[0])}</div></div><div class="items">${t[1].map((x,i)=>`<article class="item" data-index="${i}"><div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div><span>→</span></article>`).join('')}</div>`;document.getElementById('back').onclick=()=>renderUnits(current);panel.querySelectorAll('.item').forEach(x=>x.onclick=()=>renderDemo(Number(x.dataset.index)));}
function renderDemo(index){const s=subjects[current],item=s.topics[topicIndex][1][index];panel.innerHTML=`<div class="panel-nav"><button class="nav-btn" id="back" type="button">← Kazanımlara dön</button><div class="step">${esc(s.name)} / ${esc(item[0])}</div></div><div class="demo"><div><div class="code">DEMO</div><h2>${esc(item[0])}</h2><p><strong>${esc(item[1])}</strong><br><br>Bu kazanım için örnek ders anlatımı, alıştırmalar ve soru bankası demo olarak gösterilmektedir.</p></div></div>`;document.getElementById('back').onclick=()=>renderTopic(topicIndex);}
function toggleTheme(){const dark=document.documentElement.dataset.theme==='dark';const next=dark?'light':'dark';document.documentElement.dataset.theme=next;themeBtn.textContent=dark?'☀️ Beyaz Mod':'🌙 Siyah Mod';localStorage.setItem('theme',next)}
const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;themeBtn.textContent=saved==='light'?'☀️ Beyaz Mod':'🌙 Siyah Mod'}themeBtn.onclick=toggleTheme;renderSubjects();
</script>
</body>
</html>
